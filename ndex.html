<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>webpage</title>
  <style>
    h1{
      text-align: center;
      color: #090994;
    }
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container{
      width: 100%;
      height: 100vh;
      background: linear-gradient(to right buttom, pink);
      justify-content: center;
      align-items: center;
      display: flex;
    }
    body{
      background: linear-gradient(to right buttom, pink, white);
      justify-content: center;
      align-items: center;
      display: flex;
      background-color: white;
    }
    .from-box{
      width: 80%;
      max-width: 400px;
      border-radius: 8px;
      background: 360deg blue, red;
      border: none;
      padding: 20px 28px;
      border-color: white;
      margin-left: 20px;
      margin-right: 20px;
      margin: 0px;
    }
    input{
      width: 110%;
      padding: 18px 16px;
      border: none;
      outline: none;
      border-radius: 8px;
      background-color: #a3a3a331;
      font-size: 16px;
      margin-block: 24px;
      font-weight: 700;
      cursor: pointer;
      transition: .4s;
    }
    .from-box from{
      margin-block: 30px;
    }
    input[type="button"]{
      background-color: blue;
      margin: 6px;
      font-size: 15px;
      color: white;
      width:100%;
      transition: .4s;
    }
    input:hover{
      font-size: 17px;
      padding:16px 45px;
      font-size:18px;
      width:100%;
      margin-top:25px;
      padding:14px;
      border:2px solid #38bdf8;
      border-radius:14px;
      background:transparent;
      color: black;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }
    body{
      transition: .10s;
    }
   input[type="button"]:hover{
     background-color: darkblue;
     transition: .4s;
     width:100%;
   }
   a{
     color: gray;
     font-size: 14px;
     text-align: left;
     transition: .3s;
   }
  </style>
</head>
<body>
  <div class="container">
    <div class="from-box">
      <header>
        <h1>Register</h1>
        <br>
      </header>
      <from action="">
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Username or Email">
        <input type="password" placeholder="create password ">
        <input type="button" value="Register Now">
        <a href="index.html">You already have an account.</a>
      </from>
    </div>
  </div>
</body>
</html>
